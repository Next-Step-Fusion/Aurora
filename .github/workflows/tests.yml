name: Testing

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip github]')"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
        build_command: ['pip install --editable .']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Aurora
      run: ${{ matrix.build_command }}
    - name: Move to root and try importing Aurora
      run: |
        cd /
        python -c "import aurora; print(aurora.__version__)"

    # Regression suite: baseline-locked, no equilibrium file needed.
    # See tests/README.md. Runs only for the editable install, where the
    # in-tree baselines and the built extension line up.
    - name: Run the regression suite
      run: |
        pip install pytest
        python -m pytest tests/ -v
