[project]
name = "aurorafusion"
dynamic = ["version"]
description = "Aurora package for particle transport, radiation and neutrals in magnetically-confined plasmas"
readme = {file = "README.rst", content-type = "text/x-rst"}  # Explicitly set long_description
authors = [
    { name = "F. Sciortino", email = "sciortino@psfc.mit.edu" },
]
urls = { "Homepage" = "https://github.com/fsciortino/Aurora" }
keywords = ["particle and impurity transport, neutrals, radiation, magnetic confinement fusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    # numpy 2 is required: the code uses np.trapezoid, which numpy 1 does not have
    "numpy>=2.0.0",
    # scipy 1.13 is the first release supporting numpy 2
    "scipy>=1.13",
    # matplotlib 3.9 is the first release supporting numpy 2
    "matplotlib>=3.9",
    # pandas 2.2.2 is the first release supporting numpy 2
    "pandas>=2.2.2",
    "requests",
    "pytest>=9.1.1",
]

[build-system]
# scikit-build-core is used to integrate with CMake
requires = ["scikit-build-core>=0.8", "numpy>=2.0.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
ninja.version = ">=1.10"
cmake.version = ">=3.17.2"
wheel.packages = ["aurora"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "aurora/__init__.py"
